name: Validate SasPay branch

on:
  push:
    branches: ["feature/saspay-checkout"]
  pull_request:
    branches: ["main"]
    paths:
      - "worker/**"
      - "src/**"
      - "functions/**"
      - "wrangler.jsonc"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/validate-saspay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-saspay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check generated Worker types
        run: bunx wrangler@4 types worker-configuration.d.ts --config wrangler.jsonc --check

      - name: Type-check application and Worker
        run: bun run lint

      - name: Test SasPay payment handling
        run: bun run test

      - name: Build frontend
        run: bun run build

      - name: Validate Worker bundle without deploying
        run: bunx wrangler@4 deploy --dry-run --config wrangler.jsonc
